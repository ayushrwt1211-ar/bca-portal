<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Student Portal | JBKP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl mb-4">
        <i class="fas fa-graduation-cap text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold">BCA Student Portal</h1>
      <p class="text-slate-400 text-sm mt-1">Section G • JBKP Faridabad</p>
    </div>

    <!-- Login Form -->
    <div id="login-section" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Enter Student Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i class="fas fa-envelope"></i>
          </span>
          <input type="email" id="email-input" placeholder="student@gmail.com" 
            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
        </div>
      </div>

      <button id="send-link-btn" onclick="sendEmailOTP()" 
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 font-semibold rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
        <span>Get Verification Email Link</span>
        <i class="fas fa-paper-plane"></i>
      </button>

      <p id="status-msg" class="text-sm text-center mt-3 hidden"></p>
    </div>

    <!-- Dashboard (After Login) -->
    <div id="dashboard-section" class="hidden text-center space-y-6">
      <div class="p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400">
        <i class="fas fa-check-circle text-3xl mb-2"></i>
        <h2 class="text-xl font-bold">Welcome Back!</h2>
        <p id="user-email-display" class="text-sm text-slate-300 mt-1"></p>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-left space-y-2 text-sm">
        <p class="text-slate-400"><strong>Batch:</strong> BCA First Year (Section G)</p>
        <p class="text-slate-400"><strong>Status:</strong> Verified Student</p>
      </div>

      <button onclick="logout()" class="w-full py-2.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 font-semibold rounded-xl transition">
        Sign Out
      </button>
    </div>
  </div>

  <!-- Firebase Modular SDK v13.1.0 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    // Firebase Configuration from your screenshot
    const firebaseConfig = {
      apiKey: "AIzaSyAtzUDD_z3XrJgi5eFpcRXWWCKXYeIN9IU",
      authDomain: "bca-student-portal-bd92a.firebaseapp.com",
      projectId: "bca-student-portal-bd92a",
      storageBucket: "bca-student-portal-bd92a.firebasestorage.app",
      messagingSenderId: "1091988717603",
      appId: "1:1091988717603:web:7a1d1858bbffd7517eb196"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const actionCodeSettings = {
      url: window.location.href, // Returns user back to your site
      handleCodeInApp: true
    };

    // Send Email Login Link
    window.sendEmailOTP = async function() {
      const email = document.getElementById('email-input').value.trim();

      if (!email) {
        showStatus("Please enter a valid email address.", "text-red-400");
        return;
      }

      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        window.localStorage.setItem('emailForSignIn', email);
        showStatus("Verification email sent! Check your inbox/spam folder.", "text-emerald-400");
      } catch (error) {
        console.error(error);
        showStatus("Error: " + error.message, "text-red-400");
      }
    };

    // Auto Login when clicking email link from Gmail
    if (isSignInWithEmailLink(auth, window.location.href)) {
      let email = window.localStorage.getItem('emailForSignIn');
      if (!email) {
        email = window.prompt('Please confirm your email address for login');
      }
      if (email) {
        signInWithEmailLink(auth, email, window.location.href)
          .then(async (result) => {
            window.localStorage.removeItem('emailForSignIn');
            await setDoc(doc(db, "students", result.user.uid), {
              email: result.user.email,
              lastLogin: new Date()
            }, { merge: true });
          })
          .catch((error) => console.error(error));
      }
    }

    // Auth State Monitor
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('user-email-display').innerText = user.email;
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
      }
    });

    // Logout Function
    window.logout = function() {
      signOut(auth);
    };

    function showStatus(msg, textClass) {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = msg;
      statusMsg.className = `text-sm text-center mt-3 ${textClass}`;
      statusMsg.classList.remove('hidden');
    }
  </script>
</body>
</html>
